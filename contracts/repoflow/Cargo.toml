[package]
name = "repoflow-contract"
version = "0.1.0"
edition = "2021"
description = "Soroban smart contract for the RepoFlow protocol — repo claiming, dependency splits, and funding vaults on Stellar"
authors = ["RepoFlow Labs"]
license = "MIT"
repository = "https://github.com/repoflow-labs/repoflow-contract"
homepage = "https://github.com/repoflow-labs/repoflow-contract"
documentation = "https://github.com/repoflow-labs/repoflow-contract"
keywords = ["soroban", "stellar", "smart-contract", "wasm"]
categories = ["wasm", "cryptography::cryptocurrencies"]

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { version = "22", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "22", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
strip = true
lto = true
codegen-units = 1
